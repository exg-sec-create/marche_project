<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>運営ダッシュボード</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .wrap { max-width: 1080px; }
  .stats { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin:4px 0 18px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center; }
  .stat .n { font-size:1.8rem; font-weight:800; } .stat .l { font-size:.78rem; color:var(--muted); }
  .slotgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-bottom:18px; }
  .slotcard { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .slotcard .s { font-weight:700; font-size:.85rem; } .slotcard .v { font-size:.82rem; color:var(--muted); }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar input { flex:1; min-width:200px; }
  .toolbar .btn { width:auto; margin:0; padding:12px 16px; box-shadow:none; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:var(--shadow); font-size:.9rem; }
  th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); }
  th { background:#eef5fb; font-size:.78rem; color:var(--muted); } tr:last-child td { border-bottom:none; }
  .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:.78rem; font-weight:700; }
  .pill.in, .pill.follow-up-valid { background:#e2f5e6; color:#166534; }
  .pill.out { background:#eef1f4; color:#71808a; } .pill.follow-up-invalid { background:#fdecec; color:#a12020; }
  .pill.call-connected { background:#e2f5e6; color:#166534; }
  .pill.call-not-connected { background:#fff1e5; color:#9a4b0b; }
  .pill.type-owner { background:#eaf4fd; color:#1a5fa8; } .pill.type-general { background:#fff1e5; color:#c55b0b; } .pill.type-referral { background:#f5eafa; color:#76369d; } .pill.type-vendor { background:#edf8ed; color:#2f7a33; }
  .strap { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-weight:700; }
  .strap::before { content:""; width:12px; height:12px; border-radius:50%; background:var(--strap-color); border:1px solid #0002; box-shadow:inset 0 0 0 1px #fff5; }
  .act { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px; font-size:.8rem; cursor:pointer; font-family:inherit; }
  .act.qr { border-color:#78b8a0; color:#176149; background:#f2fbf7; }
  .act:disabled { cursor:not-allowed; opacity:.58; }
  .act.delete { border-color:#efb4b4; color:#a12020; }
  .actions { display:flex; gap:6px; white-space:nowrap; }
  dialog { width:min(620px,calc(100% - 24px)); max-height:90vh; overflow:auto; border:0; border-radius:16px; padding:22px; box-shadow:0 20px 60px #17324b55; }
  dialog::backdrop { background:#17324b88; }
  .edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .edit-grid label { margin-top:0; }
  .edit-wide { grid-column:1/-1; }
  .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  .dialog-actions .btn { width:auto; margin:0; padding:11px 18px; }
  .qr-dialog { width:min(420px,calc(100% - 24px)); text-align:center; }
  .qr-dialog .section-title { margin-bottom:4px; }
  .qr-dialog-name { margin:0 0 4px; color:var(--ink); font-size:1.15rem; font-weight:800; }
  .qr-dialog-meta { margin:0 0 16px; color:var(--muted); font-size:.9rem; }
  .qr-dialog-code { display:inline-block; min-width:220px; min-height:220px; padding:14px; background:#fff; border:1px solid var(--line); border-radius:14px; }
  .qr-dialog-code img, .qr-dialog-code canvas { display:block; margin:auto; }
  .qr-dialog-link { display:block; width:max-content; margin:12px auto 0; color:var(--blue); font-size:.88rem; }
  .qr-checkin-status { margin:14px 0 0; padding:10px 12px; border-radius:10px; background:#f4f7f8; color:var(--muted); font-size:.86rem; }
  .qr-checkin-status.done { background:#e2f5e6; color:#166534; font-weight:700; }
  .btn.checkin { background:#16803c; }
  .login { max-width:380px; margin:44px auto; } .login input { margin-bottom:10px; }
  @media (max-width: 760px) { .stats { grid-template-columns:repeat(2,1fr); } .table-wrap { overflow-x:auto; } .edit-grid { grid-template-columns:1fr; } .edit-wide { grid-column:auto; } }
</style>
</head>
<body>
<div class="login card" id="loginBox">
  <div class="section-title"><span>運営</span></div>
  <input id="email" type="email" placeholder="メールアドレス" autocomplete="username" />
  <input id="password" type="password" placeholder="パスワード" autocomplete="current-password" />
  <div id="loginErr" class="error-box" style="display:none"></div>
  <button id="loginBtn" class="btn">ログイン</button>
</div>

<main class="wrap" id="main" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0">
    <h1 id="title" style="margin:0;color:var(--blue)">来場管理</h1>
    <button class="act" id="logout">ログアウト</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="n" id="sTotal">0</div><div class="l">予約総数</div></div>
    <div class="stat"><div class="n" id="sOwner" style="color:var(--blue)">0</div><div class="l">オーナー様</div></div>
    <div class="stat"><div class="n" id="sGeneral" style="color:#e87920">0</div><div class="l">一般</div></div>
    <div class="stat"><div class="n" id="sReferral" style="color:#8b4bb5">0</div><div class="l">紹介</div></div>
    <div class="stat"><div class="n" id="sVendor" style="color:#3f8f42">0</div><div class="l">業者</div></div>
    <div class="stat"><div class="n" id="sFollowUp" style="color:#166534">0</div><div class="l">有効客（一般）</div></div>
  </div>
  <div class="slotgrid" id="slotGrid"></div>
  <div class="toolbar"><input id="search" placeholder="名前・電話・メールで検索" /><button class="btn" id="csv">CSVを書き出す</button></div>
  <div class="table-wrap"><table><thead><tr><th>種別</th><th>代表者様</th><th>ブランド</th><th>時間帯</th><th>電話</th><th>架電状況</th><th>判定</th><th>ネックストラップ</th><th>状態</th><th>受付時刻</th><th>受付対応者</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>

<dialog id="editDialog">
  <form id="editForm" method="dialog">
    <div class="section-title"><span>登録内容を編集</span></div>
    <div class="edit-grid">
      <div><label for="editType">受付種別</label><select id="editType"><option value="owner">オーナー様</option><option value="general">一般</option><option value="referral">紹介</option><option value="vendor">業者</option></select></div>
      <div><label for="editName">代表者様</label><input id="editName" required /></div>
      <div><label for="editTel">電話番号</label><input id="editTel" type="tel" /></div>
      <div><label for="editEmail">メールアドレス</label><input id="editEmail" type="email" /></div>
      <div><label for="editCallStatus">架電状況</label><select id="editCallStatus"><option value="">未設定</option><option value="not_connected">未通</option><option value="connected">通電</option></select></div>
      <div><label for="editSalesperson">営業担当者</label><input id="editSalesperson" placeholder="担当者名を入力" /></div>
      <div><label for="editAdultCount">大人の来場人数</label><input id="editAdultCount" /></div>
      <div><label for="editChildCount">子どもの来場人数 <span class="hint">※小学生以下</span></label><input id="editChildCount" /></div>
      <div><label for="editSlot">来場時間帯</label><select id="editSlot"><option value="">時間指定なし</option></select></div>
      <div><label for="editOwnerBrand">建築ブランド</label><select id="editOwnerBrand"><option value="">未選択</option><option value="exceed_home">EXCEED HOME</option><option value="besto_haus">BESTO HAUS</option><option value="pg_house_yamagata">PG HOUSE 山形</option><option value="other">その他</option></select></div>
      <div><label for="editCompany">会社・店舗名</label><input id="editCompany" /></div>
      <div class="edit-wide"><label for="editBooth">ご担当・出店名</label><input id="editBooth" /></div>
      <div class="edit-wide"><label for="editReferrerName">ご紹介者（OB様）のお名前</label><input id="editReferrerName" /></div>
      <div><label for="editHomeInterest">住まいづくりへの興味</label><select id="editHomeInterest"><option value="">未選択</option><option value="interested">興味あり</option><option value="not_interested">興味なし</option></select></div>
      <div><label for="editHomeStage">現在の状況</label><select id="editHomeStage"><option value="">未選択</option><option value="considering">検討中</option><option value="not_considering">検討していない</option><option value="already_built">すでに建築している</option></select></div>
      <div><label for="editBrandAwareness">興味のあるブランド</label><select id="editBrandAwareness"><option value="">未選択</option><option value="exceed_home">EXCEED HOME</option><option value="besto_haus">BESTO HAUS</option><option value="pg_house_yamagata">PG HOUSE 山形</option><option value="unsure">まだわからない</option></select></div>
      <div><label for="editContactPreference">希望する案内方法</label><select id="editContactPreference"><option value="">未選択</option><option value="phone">電話</option><option value="email">メール</option><option value="mail">資料を郵送</option><option value="none">案内を希望しない</option></select></div>
      <div class="edit-wide"><label for="editAddress">資料送付先住所</label><input id="editAddress" /></div>
      <div class="edit-wide"><label for="editRemarks">申込時の備考</label><textarea id="editRemarks" rows="3"></textarea></div>
      <div class="edit-wide"><label for="editAdminMemo">運営メモ</label><textarea id="editAdminMemo" rows="4" placeholder="対応履歴や当日の申し送りなど（来場者には表示されません）"></textarea></div>
    </div>
    <div id="editErr" class="error-box" style="display:none"></div>
    <div class="dialog-actions"><button type="button" class="act" id="editCancel">キャンセル</button><button type="submit" class="btn" id="editSave">保存</button></div>
  </form>
</dialog>

<dialog id="qrDialog" class="qr-dialog" aria-labelledby="qrDialogTitle">
  <div class="section-title"><span id="qrDialogTitle">受付QRコード</span></div>
  <p class="qr-dialog-name" id="qrDialogName"></p>
  <p class="qr-dialog-meta" id="qrDialogMeta"></p>
  <div class="qr-dialog-code" id="qrDialogCode" aria-label="受付用QRコード"></div>
  <a class="qr-dialog-link" id="qrDialogLink" href="#" target="_blank" rel="noopener">申請者用チケット画面を開く</a>
  <p class="qr-checkin-status" id="qrCheckinStatus" aria-live="polite"></p>
  <div class="dialog-actions"><button type="button" class="act" id="qrDialogClose">閉じる</button><button type="button" class="btn checkin" id="qrCheckinButton">受付完了</button></div>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script>
  firebase.initializeApp(window.firebaseConfig);
  const auth = firebase.auth(), db = firebase.firestore();
  const $ = id => document.getElementById(id);
  const E = window.EVENT || {};
  const DELETE_ALLOWED_EMAILS = new Set([
    "tegawa@ych-exceed.com",
    "hayasaka@ych-exceed.com",
    "takeuchi_23@besto-haus.com"
  ]);
  let all = [], unsub = null;
  let editingId = null;
  let qrDialogId = null;

  (window.TIME_SLOTS || []).forEach(slot => $("editSlot").add(new Option(slot, slot)));

  $("loginBtn").onclick = async () => {
    $("loginErr").style.display = "none";
    try { await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value); }
    catch (error) { console.error(error); $("loginErr").textContent = "ログインに失敗しました。メールアドレスとパスワードをご確認ください。"; $("loginErr").style.display = "block"; }
  };
  $("logout").onclick = () => auth.signOut();
  auth.onAuthStateChanged(user => {
    if (user) { $("loginBox").style.display = "none"; $("main").style.display = "block"; $("title").textContent = `${E.name || ""} ${E.year || ""} 来場管理`; listen(); }
    else { $("loginBox").style.display = "block"; $("main").style.display = "none"; if (unsub) { unsub(); unsub = null; } }
  });
  function listen() { unsub = db.collection("registrations").orderBy("createdAt", "desc").onSnapshot(snapshot => { all = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); render(); }, error => console.error(error)); }
  $("search").addEventListener("input", render);
  function render() {
    const query = $("search").value.trim().toLowerCase();
    $("sTotal").textContent = all.length;
    $("sOwner").textContent = all.filter(record => record.registrationType === "owner").length;
    $("sGeneral").textContent = all.filter(record => record.registrationType === "general").length;
    $("sReferral").textContent = all.filter(record => record.registrationType === "referral").length;
    $("sVendor").textContent = all.filter(record => record.registrationType === "vendor").length;
    $("sFollowUp").textContent = all.filter(record => followUpStatus(record) === "valid").length;
    const grid = $("slotGrid"); grid.innerHTML = "";
    (window.TIME_SLOTS || []).forEach(slot => { const records = all.filter(record => record.slot === slot); const checkedIn = records.filter(record => record.checkedIn).length; const card = document.createElement("div"); card.className = "slotcard"; card.innerHTML = `<div class="s">${esc(slot)}</div><div class="v">予約 ${records.length} ・ 受付 ${checkedIn}</div>`; grid.appendChild(card); });
    const rows = all.filter(record => !query || [record.name, record.tel, record.email, record.referrerName, record.adminMemo].some(value => (value || "").toLowerCase().includes(query)));
    $("rows").innerHTML = rows.map(record => { const checkedInAt = record.checkedInAt?.toDate ? fmt(record.checkedInAt.toDate()) : ""; const state = record.checkedIn ? '<span class="pill in">受付済</span>' : '<span class="pill out">未受付</span>'; const checkAction = record.checkedIn ? `<button class="act" data-un="${record.id}">受付取消</button>` : `<button class="act" data-in="${record.id}">手動受付</button>`; const qrAction = `<button class="act qr" data-qr="${record.id}" title="受付用QRコードを表示">QR表示</button>`; const deleteAction = canDelete() ? `<button class="act delete" data-delete="${record.id}">削除</button>` : ""; const status = followUpStatus(record); const followUp = record.registrationType === "general" ? `<span class="pill follow-up-${status}">${status === "valid" ? "有効客" : "無効客"}</span>` : "—"; const callStatus = record.callStatus ? `<span class="pill call-${esc(record.callStatus)}">${esc(callStatusLabel(record.callStatus))}</span>` : "—"; const brand = record.registrationType === "owner" ? ownerBrandLabel(record.ownerBrand) : "—"; const strap = neckStrapInfo(record); const strapCell = strap ? `<span class="strap" style="--strap-color:${strap.color}">${esc(strap.label)}</span>` : "—"; return `<tr><td><span class="pill type-${esc(record.registrationType || "general")}">${esc(typeLabel(record.registrationType))}</span></td><td>${esc(record.name)}${record.adminMemo ? '<br><small title="'+esc(record.adminMemo)+'">📝 メモあり</small>' : ''}</td><td>${esc(brand)}</td><td>${esc(record.slot || "指定なし")}</td><td>${esc(record.tel)}</td><td>${callStatus}</td><td>${followUp}</td><td>${strapCell}</td><td>${state}</td><td>${checkedInAt}</td><td>${esc(record.checkedInBy || "—")}</td><td><div class="actions"><button class="act" data-edit="${record.id}">編集</button>${qrAction}${checkAction}${deleteAction}</div></td></tr>`; }).join("");
    $("rows").querySelectorAll("[data-in]").forEach(button => button.onclick = () => setCheck(button.dataset.in, true));
    $("rows").querySelectorAll("[data-un]").forEach(button => button.onclick = () => setCheck(button.dataset.un, false));
    $("rows").querySelectorAll("[data-edit]").forEach(button => button.onclick = () => openEditor(button.dataset.edit));
    $("rows").querySelectorAll("[data-qr]").forEach(button => button.onclick = () => openQrDialog(button.dataset.qr));
    $("rows").querySelectorAll("[data-delete]").forEach(button => button.onclick = () => deleteRegistration(button.dataset.delete));
  }
  function openQrDialog(id) {
    const record = all.find(item => item.id === id);
    if (!record) return;
    qrDialogId = id;
    const ticketUrl = new URL("ticket.html", location.href);
    ticketUrl.search = new URLSearchParams({ id }).toString();
    $("qrDialogName").textContent = `${record.name || "名称未設定"} 様`;
    $("qrDialogMeta").textContent = `${typeLabel(record.registrationType)}受付 ・ ${record.slot ? `来場 ${record.slot}` : "時間指定なし"}`;
    $("qrDialogLink").href = ticketUrl.href;
    $("qrDialogCode").replaceChildren();
    new QRCode($("qrDialogCode"), { text:ticketUrl.href, width:220, height:220, correctLevel:QRCode.CorrectLevel.M });
    updateQrCheckinControls(record);
    $("qrDialog").showModal();
  }
  function updateQrCheckinControls(record) {
    const status = $("qrCheckinStatus"), button = $("qrCheckinButton");
    status.classList.toggle("done", Boolean(record.checkedIn));
    status.textContent = record.checkedIn
      ? `✓ 受付済み${record.checkedInBy ? `（対応者：${record.checkedInBy}）` : ""}`
      : "QRを読み取るか、このボタンから直接受付できます。";
    button.hidden = Boolean(record.checkedIn);
    button.disabled = false;
    button.textContent = "受付完了";
  }
  $("qrCheckinButton").onclick = async () => {
    const record = all.find(item => item.id === qrDialogId);
    if (!record || record.checkedIn || !confirm(`${record.name || "名称未設定"} 様を受付完了にしますか？`)) return;
    const button = $("qrCheckinButton"); button.disabled = true; button.textContent = "受付処理中…";
    try {
      await setCheck(record.id, true, "dashboard_qr");
      record.checkedIn = true; record.checkedInBy = auth.currentUser?.email || "";
      updateQrCheckinControls(record);
    } catch (error) {
      console.error("QR dialog check-in failed", error);
      alert("受付処理に失敗しました。通信環境をご確認のうえ、もう一度お試しください。");
      button.disabled = false; button.textContent = "受付完了";
    }
  };
  $("qrDialogClose").onclick = () => $("qrDialog").close();
  $("qrDialog").onclick = event => { if (event.target === $("qrDialog")) $("qrDialog").close(); };
  function canDelete() { return DELETE_ALLOWED_EMAILS.has((auth.currentUser?.email || "").toLowerCase()); }
  async function deleteRegistration(id) {
    if (!canDelete()) { alert("このアカウントには削除権限がありません。"); return; }
    const record = all.find(item => item.id === id);
    if (!record || !confirm(`「${record.name || "名称未設定"}」の登録を削除します。\nこの操作は取り消せません。`)) return;
    try {
      await db.collection("registrations").doc(id).delete();
    } catch (error) {
      console.error("Registration deletion failed", error);
      alert(error.code === "permission-denied" ? "削除権限がありません。Firestore セキュリティルールが最新か、ログイン中のアカウントをご確認ください。" : "削除に失敗しました。通信環境をご確認のうえ、もう一度お試しください。");
    }
  }
  async function setCheck(id, checkedIn, method = "dashboard_manual") {
    const handledBy = auth.currentUser?.email || "";
    await db.collection("registrations").doc(id).update({
      checkedIn,
      checkedInAt: checkedIn ? firebase.firestore.FieldValue.serverTimestamp() : null,
      checkedInBy: checkedIn ? handledBy : null,
      checkedInMethod: checkedIn ? method : null,
      checkInHistory: firebase.firestore.FieldValue.arrayUnion({
        action: checkedIn ? "check_in" : "cancel",
        at: firebase.firestore.Timestamp.now(),
        by: handledBy,
        method
      })
    });
  }
  function openEditor(id) { const record = all.find(item => item.id === id); if (!record) return; editingId = id; const fields = { editType:"registrationType", editName:"name", editTel:"tel", editEmail:"email", editCallStatus:"callStatus", editSalesperson:"salesperson", editAdultCount:"adultCount", editChildCount:"childCount", editSlot:"slot", editOwnerBrand:"ownerBrand", editCompany:"company", editBooth:"booth", editReferrerName:"referrerName", editHomeInterest:"homeInterest", editHomeStage:"homeStage", editBrandAwareness:"brandAwareness", editContactPreference:"contactPreference", editAddress:"address", editRemarks:"remarks", editAdminMemo:"adminMemo" }; Object.entries(fields).forEach(([field, key]) => $(field).value = record[key] ?? ""); if (!record.adultCount && record.partySize) $("editAdultCount").value = record.partySize; $("editErr").style.display = "none"; $("editDialog").showModal(); }
  $("editCancel").onclick = () => $("editDialog").close();
  $("editForm").onsubmit = async event => {
    event.preventDefault();
    if (!editingId) return;
    const name = $("editName").value.trim();
    if (!name) { $("editErr").textContent = "代表者様のお名前を入力してください。"; $("editErr").style.display = "block"; return; }
    const registrationType = $("editType").value;
    const homeInterest = $("editHomeInterest").value;
    const homeStage = $("editHomeStage").value;
    const followUpEligible = registrationType === "general" && homeInterest === "interested" && homeStage !== "already_built";
    const save = $("editSave");
    save.disabled = true;
    $("editErr").style.display = "none";
    const updatedFields = { registrationType, name, tel:$("editTel").value.trim(), email:$("editEmail").value.trim(), callStatus:$("editCallStatus").value, salesperson:$("editSalesperson").value.trim(), adultCount:$("editAdultCount").value.trim(), childCount:$("editChildCount").value.trim(), slot:$("editSlot").value, ownerBrand:$("editOwnerBrand").value, company:$("editCompany").value.trim(), booth:$("editBooth").value.trim(), referrerName:$("editReferrerName").value.trim(), homeInterest, homeStage, brandAwareness:$("editBrandAwareness").value, contactPreference:$("editContactPreference").value, address:$("editAddress").value.trim(), remarks:$("editRemarks").value.trim(), adminMemo:$("editAdminMemo").value.trim(), followUpEligible, followUpStatus:followUpEligible ? "valid" : "invalid" };
    try {
      const savedId = editingId;
      await db.collection("registrations").doc(savedId).update({ ...updatedFields, updatedAt:firebase.firestore.FieldValue.serverTimestamp(), updatedBy:auth.currentUser.email });
      // onSnapshot の再通知を待たず、保存完了した内容を集計・一覧へ確実に反映する。
      // Firestore からの次の通知時には、サーバー上の最新データで再同期される。
      const savedRecord = all.find(item => item.id === savedId);
      if (savedRecord) Object.assign(savedRecord, updatedFields);
      render();
      editingId = null;
      $("editDialog").close();
    } catch (error) {
      console.error("Registration update failed", error);
      $("editErr").textContent = error.code === "permission-denied"
        ? "保存権限がありません。Firestore セキュリティルールが最新か、ログイン中のアカウントをご確認ください。"
        : "保存に失敗しました。通信環境をご確認のうえ、もう一度お試しください。";
      $("editErr").style.display = "block";
    } finally { save.disabled = false; }
  };
  $("csv").onclick = () => { const head = ["受付種別", "代表者様", "紹介者（OB様）", "建築ブランド", "時間帯", "電話", "架電状況", "営業担当者", "メール", "資料送付先住所", "備考", "運営メモ", "大人人数", "子ども人数（小学生以下）", "会社・店舗名", "ご担当・出店名", "住まいづくりへの興味", "現在の状況", "興味のあるブランド", "希望する案内方法", "判定", "ネックストラップ", "受付", "受付時刻", "受付対応者"]; const lines = [head.join(",")].concat(all.map(record => [typeLabel(record.registrationType), record.name, record.referrerName, ownerBrandLabel(record.ownerBrand), record.slot, record.tel, callStatusLabel(record.callStatus), record.salesperson, record.email, record.address, record.remarks, record.adminMemo, record.adultCount || record.partySize, record.childCount, record.company, record.booth, homeInterestLabel(record.homeInterest), homeStageLabel(record.homeStage), brandAwarenessLabel(record.brandAwareness), contactPreferenceLabel(record.contactPreference), followUpStatusLabel(record), neckStrapInfo(record)?.label || "", record.checkedIn ? "済" : "未", record.checkedInAt?.toDate ? fmt(record.checkedInAt.toDate()) : "", record.checkedInBy || ""].map(cell).join(","))); const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv" }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "marche2026_" + Date.now() + ".csv"; link.click(); URL.revokeObjectURL(link.href); };
  function fmt(date) { return date.toLocaleString("ja-JP", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" }); }
  function typeLabel(type) { return ({ owner:"オーナー様", general:"一般", referral:"紹介", vendor:"業者" })[type] || "一般"; }
  function homeInterestLabel(value) { return ({ interested:"興味あり", not_interested:"興味なし" })[value] || ""; }
  function homeStageLabel(value) { return ({ considering:"検討中", not_considering:"検討していない", already_built:"すでに建築している" })[value] || ""; }
  function brandAwarenessLabel(value) { return ({ exceed_home:"EXCEED HOME", besto_haus:"BESTO HAUS", pg_house_yamagata:"PG HOUSE 山形", unsure:"まだわからない" })[value] || ""; }
  function ownerBrandLabel(value) { return ({ exceed_home:"EXCEED HOME", besto_haus:"BESTO HAUS", pg_house_yamagata:"PG HOUSE 山形", other:"その他" })[value] || ""; }
  function contactPreferenceLabel(value) { return ({ phone:"電話で話を聞きたい", email:"メールで情報を受け取りたい", mail:"資料を郵送してほしい", none:"今は案内を希望しない" })[value] || ""; }
  function callStatusLabel(value) { return ({ not_connected:"未通", connected:"通電" })[value] || ""; }
  function followUpStatus(record) { return record.followUpStatus || (record.homeInterest === "interested" && record.homeStage !== "already_built" ? "valid" : "invalid"); }
  function followUpStatusLabel(record) { return record.registrationType === "general" ? (followUpStatus(record) === "valid" ? "有効客" : "無効客") : ""; }
  function neckStrapInfo(record) {
    if (record.registrationType === "owner") return ({ exceed_home:{ label:"オレンジ", color:"#f97316" }, besto_haus:{ label:"青", color:"#2563eb" }, pg_house_yamagata:{ label:"ピンク", color:"#ec4899" } })[record.ownerBrand] || null;
    if (record.registrationType === "referral") return { label:"黄色", color:"#facc15" };
    if (record.registrationType === "general") return followUpStatus(record) === "valid" ? { label:"赤", color:"#dc2626" } : { label:"グレー", color:"#6b7280" };
    return null;
  }
  function esc(value) { return String(value ?? "").replace(/[&<>"']/g, character => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[character]); }
  function cell(value) { value = String(value ?? ""); return /[",\n]/.test(value) ? '"' + value.replace(/"/g, '""') + '"' : value; }
</script>
